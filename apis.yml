aid: inmemori
name: Inmemori
description: 'Inmemori is a French funeral services company ("pompes funebres") that
  organizes and manages personalized funeral arrangements with an emphasis on transparency,
  fair pricing, and full handling of legal and administrative procedures. Available
  24/7 across agencies in Paris, Bordeaux, Nantes, and Lyon, Inmemori supports families
  through burial and cremation, secular and religious ceremonies (Christian, Jewish,
  Muslim, Buddhist), coffins, urns and floral arrangements, funeral pre-planning, and
  online memorial tribute pages. Backed by Partech, the company operates in the consumer
  end-of-life services sector. This profile was added to the API Evangelist network
  as a portfolio-company lead; Inmemori publishes a consumer website and blog but no
  public developer API surface was found during enrichment.'
